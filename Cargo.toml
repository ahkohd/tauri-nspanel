[workspace]
members = [
  ".",
  "examples/basic/src-tauri",
  "examples/panel_builder/src-tauri",
  "examples/fullscreen/src-tauri",
  "examples/mouse_tracking/src-tauri",
  "examples/hover_activate/src-tauri",
]

[package]
name = "tauri-nspanel"
version = "2.1.0"
authors = ["Victor Aremu <me@victorare.mu>"]
description = "A plugin for subclassing Tauri's NSWindow to NSPanel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahkohd/tauri-nspanel"
documentation = "https://docs.rs/tauri-nspanel"
readme = "README.md"
keywords = ["tauri", "macos", "nspanel", "window", "desktop"]
categories = ["gui", "os::macos-apis"]
edition = "2021"
rust-version = "1.75"
publish = ["crates-io"]
include = [
  "/src/**",
  "/examples/*.rs",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE_APACHE-2.0",
  "/LICENSE_MIT",
]

[dependencies]
tauri = { version = "2.8.5", features = ["macos-private-api"] }
pastey = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = { version = "0.6.1", features = ["exception"] }
objc2-app-kit = "0.3.1"
objc2-foundation = "0.3.1"

[features]
cargo-clippy = []

[workspace.dependencies]
tauri = "2.8.5"
tauri-build = "2.4.1"
