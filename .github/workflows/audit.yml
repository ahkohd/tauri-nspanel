name: Audit

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - v2.1
      - v2
      - v1
    paths:
      - ".github/workflows/audit.yml"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
  pull_request:
    branches:
      - v2.1
      - v2
      - v1
    paths:
      - ".github/workflows/audit.yml"
      - "**/Cargo.lock"
      - "**/Cargo.toml"

jobs:
  audit:
    runs-on: macos-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Generate workspace lockfile
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tauri 2's Linux GTK3 backend pins glib 0.18. tauri-nspanel is
          # macOS-only, so this dependency is never compiled or shipped.
          ignore: RUSTSEC-2024-0429
